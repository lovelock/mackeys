[package]
name = "mackeys"
version = "0.1.0"
edition = "2024"
description = "macOS-style keyboard semantics for Linux, one binary. evdev -> uinput clean-room implementation inspired by Toshy's proven core."
license = "MIT"

[dependencies]
anyhow = "1"
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
signal-hook = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]

[profile.release]
lto = "thin"
strip = "symbols"
